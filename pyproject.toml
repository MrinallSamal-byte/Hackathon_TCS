[project]
name = "campusbite"
version = "1.0.0"
description = "biteMatch — Open-Source AI Conversational Canteen Recommender & Kitchen Telemetry (FastAPI)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mrinal Samal" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

# Vercel Python preset: auto-detects FastAPI from the dependencies above and
# serves this ASGI app for every route (no Mangum/adapter needed).
[tool.vercel]
entrypoint = "backend.app:app"
